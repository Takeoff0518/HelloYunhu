# HelloYunhu 配置示例。程序首次运行会在工作目录生成 config.yaml 并提示填写，
# 也可以复制本文件改名后按需修改。运行配置包含机器人令牌，已在 .gitignore 中排除。
#
# 全部配置项的说明在 M4 补齐的 docs/guides/configuration.md 中。

# 云湖机器人本身。一个进程服务一个机器人，多个机器人请开多个进程。
bot:
  # 云湖机器人令牌，从机器人后台获取。
  token: "请替换为真实的机器人令牌"

# 事件从哪里进来。
receive:
  # websocket 用订阅连接（默认），webhook 用 HTTP 推送，both 同时使用。
  mode: websocket
  # 只有 mode 含 webhook 时才需要这一段。
  webhook:
    # 监听地址。需要云湖能访问到，通常配合反向代理或内网穿透。
    listen: 127.0.0.1:8081
    # 写在推送地址的路径里，至少 24 个字符。云湖的推送没有签名，
    # 这个令牌就是唯一的凭据，泄露等于任何人可以伪造事件。
    token: ""
    # 只接受这些来源网段，留空表示不限制。云湖的出口网段需要自行确认。
    allowed_ips: []

# 我们对外提供的 OneBot 连接，至少一个。每个连接对应一个框架，
# 事件会广播给所有连接，动作调用共用同一个云湖客户端。
onebot:
  - name: astrbot
    # 框架监听的反向 WebSocket 地址。
    url: ws://127.0.0.1:6199/ws
    # 框架侧配置的访问令牌，没有设置就留空。
    access_token: ""

# 日志设置。日志同时写入终端与工作目录下的 logs/，文件名是当天日期，
# 例如 2026-11-15.log，跨天自动切换，文件名不带前缀。
log:
  # 级别：debug、info、warn、error。排查问题时设为 debug。
  level: info
  # 格式：text 面向终端阅读，json 便于日志采集。
  format: text
  # 为真时在 debug 级别输出收到的原始事件，只用于排查协议问题。
  # 原始事件包含消息正文与昵称，正常运行时应保持 false。
  raw_events: false
  # 日志保留天数，30 表示保留最近三十天。-1 表示永不删除，0 不被接受。
  keep_days: 30
  # 为真时把前一天的日志压缩成 .log.gz，默认开启。
  # 压缩后排查需要先解压，用 zcat 或解压工具打开即可。
  compress: true

# 持久化设置。标识映射保存在这里。
storage:
  # SQLite 文件路径，所在目录不存在时自动创建。
  path: data/helloyunhu.db
  # 消息标识映射的保留时长。
  message_ttl: 168h

# 云湖平台的服务地址，一般不需要修改。
yunhu:
  api_base: https://chat-go.jwzhd.com/open-apis/v1
  subscribe_url: wss://ws.jwzhd.com/subscribe
  # 每秒最多发起的接口调用次数，0 表示不限流。
  # 平台上限是每秒十次，默认留有余量；发送消息不做重试，这里只做匀速。
  rate_limit: 10

# 向框架声明的能力。这两个值用于回答框架对 can_send_image 与 can_send_record
# 的查询，是声明而不是开关，修改它们不会改变程序的实际行为。
capabilities:
  # 能否发送图片，默认 true。
  can_send_image: true
  # 能否发送语音气泡，默认 false。
  # 云湖没有语音发送接口，语音只能作为文件上传。改成 true 之后，框架会认为
  # 可以发语音并送来 record 段，程序仍然按文件发送，客户端收到的还是文件，
  # 不会出现可点击播放的语音气泡。
  can_send_record: false

# 只读诊断接口。默认关闭，开启后提供 /healthz 与 /status 两个端点。
diagnostics:
  enabled: false
  # 只监听本机，不要暴露到公网。
  listen: 127.0.0.1:9090
